name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: YT7th-windows.zip
            resolve_artifact: YT7th-Resolve-windows.zip
            premiere_artifact: YT7th-Premiere-windows.zip
          - os: macos-14
            artifact: YT7th-macos.zip
            resolve_artifact: YT7th-Resolve-macos.zip
            premiere_artifact: YT7th-Premiere-macos.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Smoke import
        run: >
          python -c "import version, updater;
          from yt7th_engine import data, auth, resources, downloader, queue_manager, server, service;
          import hosts.common.engine_client, hosts.resolve.importer, hosts.resolve.resolve_host"

      - name: Run tests
        run: python -m pytest -q

      - name: Test Premiere client (Node)
        run: node --test hosts/premiere/client/engine.test.js

      - name: Fetch ffmpeg, ffprobe, deno (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          # FFmpeg + ffprobe (BtbN static)
          $ff = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $ff -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath fftmp
          Copy-Item (Get-ChildItem fftmp -Recurse -Filter ffmpeg.exe)[0].FullName bin/ffmpeg.exe
          Copy-Item (Get-ChildItem fftmp -Recurse -Filter ffprobe.exe)[0].FullName bin/ffprobe.exe
          # Deno
          $dn = "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest $dn -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath dntmp
          Copy-Item dntmp/deno.exe bin/deno.exe

      - name: Fetch ffmpeg, ffprobe, deno + make icns (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p bin
          # FFmpeg + ffprobe (evermeet static x86_64)
          curl -L -o ffmpeg.zip https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip
          curl -L -o ffprobe.zip https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip
          unzip -o ffmpeg.zip -d bin
          unzip -o ffprobe.zip -d bin
          chmod +x bin/ffmpeg bin/ffprobe
          # Deno (arm64, native on Apple Silicon)
          curl -L -o deno.zip https://github.com/denoland/deno/releases/latest/download/deno-aarch64-apple-darwin.zip
          unzip -o deno.zip -d bin
          chmod +x bin/deno
          # Generate .icns from logo.png
          mkdir -p logo.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s assets/logo.png --out logo.iconset/icon_${s}x${s}.png
            d=$((s*2)); sips -z $d $d assets/logo.png --out logo.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns logo.iconset -o assets/logo.icns

      - name: Build
        run: pyinstaller build.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/YT7th/* -DestinationPath ${{ matrix.artifact }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/YT7th.app ${{ matrix.artifact }}

      # --- DaVinci Resolve plugin: hosts/ source + the engine binary ---
      # Layout: <root>/hosts/{common,resolve}  and  <root>/engine/<binary>.
      # engine_client.connect() auto-launches <root>/engine/YT7th[.exe|.app]
      # with --serve. Install by dropping the whole folder under Resolve's
      # Fusion/Scripts/Utility, then run hosts/resolve/YT7th.py.
      - name: Package Resolve plugin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = "YT7th-Resolve"
          New-Item -ItemType Directory -Force "$p/hosts", "$p/engine" | Out-Null
          Copy-Item hosts/__init__.py "$p/hosts/"
          Copy-Item -Recurse hosts/common, hosts/resolve "$p/hosts/"
          Copy-Item -Recurse dist/YT7th/* "$p/engine/"
          Get-ChildItem -Recurse "$p" -Include __pycache__ -Directory |
            Remove-Item -Recurse -Force
          Compress-Archive -Path "$p/*" -DestinationPath ${{ matrix.resolve_artifact }}

      - name: Package Resolve plugin (macOS)
        if: runner.os == 'macOS'
        run: |
          p="YT7th-Resolve"
          mkdir -p "$p/hosts" "$p/engine"
          cp hosts/__init__.py "$p/hosts/"
          cp -R hosts/common hosts/resolve "$p/hosts/"
          cp -R dist/YT7th.app "$p/engine/"
          find "$p" -name __pycache__ -type d -prune -exec rm -rf {} +
          ditto -c -k --keepParent "$p" ${{ matrix.resolve_artifact }}

      # --- Premiere CEP panel: the extension folder + the engine binary ---
      # Unzips to  com.seventh.yt7th.premiere/  ready to drop into Adobe's
      # CEP/extensions folder; engine_client (engine.js) auto-launches
      # engine/YT7th[.exe|.app] --serve.
      - name: Package Premiere plugin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $e = "com.seventh.yt7th.premiere"
          New-Item -ItemType Directory -Force "$e/engine" | Out-Null
          Copy-Item -Recurse hosts/premiere/CSXS, hosts/premiere/client, hosts/premiere/host "$e/"
          Copy-Item hosts/premiere/.debug, hosts/premiere/README.md "$e/"
          Remove-Item "$e/client/engine.test.js" -ErrorAction SilentlyContinue
          Copy-Item -Recurse dist/YT7th/* "$e/engine/"
          Compress-Archive -Path "$e" -DestinationPath ${{ matrix.premiere_artifact }}

      - name: Package Premiere plugin (macOS)
        if: runner.os == 'macOS'
        run: |
          e="com.seventh.yt7th.premiere"
          mkdir -p "$e/engine"
          cp -R hosts/premiere/CSXS hosts/premiere/client hosts/premiere/host "$e/"
          cp hosts/premiere/.debug hosts/premiere/README.md "$e/"
          rm -f "$e/client/engine.test.js"
          cp -R dist/YT7th.app "$e/engine/"
          ditto -c -k --keepParent "$e" ${{ matrix.premiere_artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.resolve_artifact }}
          path: ${{ matrix.resolve_artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.premiere_artifact }}
          path: ${{ matrix.premiere_artifact }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          files: |
            ${{ matrix.artifact }}
            ${{ matrix.resolve_artifact }}
            ${{ matrix.premiere_artifact }}
